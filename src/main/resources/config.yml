# ==========================================
#    CATEGORÍAS DE EFECTOS (archivos externos)
#    Los efectos se cargan desde: plugins/CustomEffects/categories/<nombre>.yml
# ==========================================

# ==========================================
#         MENÚ DE FORMATOS DE TEXTO
#    Accesible con el comando /formato
#    Permite elegir Bold, Underline, Italic
#    y sus combinaciones.
# ==========================================
# ==========================================
#         EDITOR DE RANGOS
#    Editor visual web para crear texturas
#    de rangos. Accesible con /rankeditor
# ==========================================
rank-editor:
  enable: true
  port: 25580
  bind-address: "0.0.0.0"
  # Dominio o IP publica del servidor.
  # Si pones un dominio (ej: editor.ejemplo.com), la URL usara ese dominio en vez de la IP.
  # Si lo dejas vacio, usa la IP del server.properties.
  public-host: ""
  # HTTPS con certificado auto-firmado (generado automaticamente).
  # El navegador mostrara una advertencia de certificado, pero NO mostrara "No seguro".
  # Si usas un dominio real, puedes poner un certificado de Let's Encrypt en su lugar.
  use-https: true
  default-canvas-width: 128
  default-canvas-height: 32

