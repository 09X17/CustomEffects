ninguno:
  enable: true
  slot: 10
  material: PAPER
  custom-model-data: 2
  # model-data permite usar un CMD diferente por rango del jugador
  # Si el rango del jugador no está en la lista, usa "default" o el custom-model-data base
  model-data:
    default: 2
    owner: 3
    admin: 4
    mod: 5
  display: "&#C8F0FF&lREINICIAR PREFIJO"
  group: "all"
  prefix: ""
  permission: ""
  lore:
    - "  &8ᴘʀᴇꜰɪᴊᴏꜱ &8ᴅᴇ &8ʀᴀɴɢᴏ"
    - ""
    - " &b┃ &7Prefijo Actual:"
    - " &f  ➜ %ampleffects_prefix%%ampleffects_hex%%player_name%"
    - ""
    - " &b┃ &7Cambiará a:"
    - " &f  ➜ %luckperms_prefix%%ampleffects_hex%%player_name%"
    - ""
    - " &e✦ &7Haz clic para cambiar"

