<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CustomEffects - Rank Editor</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap");
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #0a0a12;
        --bg2: #0e0e1a;
        --panel: #12121f;
        --panel2: #161628;
        --border: #1e1e38;
        --border2: #2a2a4a;
        --accent: #6c5ce7;
        --accent2: #a855f7;
        --accent-glow: rgba(108, 92, 231, 0.3);
        --red: #ef4444;
        --green: #22c55e;
        --yellow: #eab308;
        --blue: #3b82f6;
        --text: #e8e8f0;
        --text2: #8888aa;
        --text3: #555570;
        --hover: #1a1a30;
        --tool-bg: #14142a;
        --canvas-bg: repeating-conic-gradient(#1a1a28 0% 25%, #161624 0% 50%)
          50%/16px 16px;
        --radius: 8px;
        --radius-sm: 5px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        user-select: none;
      }
      ::selection {
        background: var(--accent);
        color: #fff;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--accent);
      }

      /* TOPBAR */
      .topbar {
        background: linear-gradient(180deg, var(--panel2), var(--panel));
        border-bottom: 1px solid var(--border);
        padding: 0 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 48px;
        flex-shrink: 0;
        z-index: 10;
      }
      .topbar .logo-area {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-right: 12px;
        padding-right: 16px;
        border-right: 1px solid var(--border);
      }
      .topbar .logo-icon {
        width: 32px;
        height: 32px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 800;
        color: #fff;
        box-shadow: 0 0 20px var(--accent-glow);
      }
      .topbar .logo-text {
        font-weight: 700;
        font-size: 15px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .topbar .logo-sub {
        font-size: 9px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-top: -2px;
      }
      .tb {
        background: var(--tool-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        font-weight: 500;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .tb:hover {
        background: var(--hover);
        border-color: var(--accent);
        box-shadow: 0 0 12px var(--accent-glow);
      }
      .tb:disabled {
        opacity: 0.3;
        cursor: default;
        box-shadow: none;
      }
      .tb.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-color: transparent;
        color: #fff;
        font-weight: 600;
      }
      .tb.primary:hover {
        box-shadow: 0 0 24px var(--accent-glow);
        transform: translateY(-1px);
      }
      .tb.danger {
        border-color: var(--red);
        color: var(--red);
      }
      .tb.danger:hover {
        background: rgba(239, 68, 68, 0.15);
      }
      .sep {
        width: 1px;
        height: 24px;
        background: var(--border);
        margin: 0 4px;
      }
      .topbar input[type="number"] {
        width: 52px;
        background: var(--tool-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 5px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        text-align: center;
        font-family: inherit;
      }
      .topbar select {
        background: var(--tool-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-family: inherit;
        cursor: pointer;
      }
      .topbar label {
        font-size: 10px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }

      /* MAIN */
      .main {
        flex: 1;
        display: flex;
        overflow: hidden;
      }

      /* TOOLBAR */
      .toolbar {
        background: var(--panel);
        border-right: 1px solid var(--border);
        width: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 10px 0;
        gap: 4px;
        flex-shrink: 0;
      }
      .tool-btn {
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        cursor: pointer;
        border: 2px solid transparent;
        background: transparent;
        transition: var(--transition);
        position: relative;
      }
      .tool-btn svg {
        width: 20px;
        height: 20px;
        stroke: var(--text2);
        fill: none;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .tool-btn:hover {
        background: var(--hover);
        border-color: var(--border2);
      }
      .tool-btn:hover svg {
        stroke: var(--text);
      }
      .tool-btn.active {
        background: linear-gradient(
          135deg,
          rgba(108, 92, 231, 0.2),
          rgba(168, 85, 247, 0.2)
        );
        border-color: var(--accent);
        box-shadow: 0 0 16px var(--accent-glow);
      }
      .tool-btn.active svg {
        stroke: var(--accent2);
      }
      .tool-sep {
        width: 28px;
        height: 1px;
        background: var(--border);
        margin: 4px 0;
      }

      /* CANVAS */
      .canvas-area {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--canvas-bg);
        overflow: hidden;
        position: relative;
      }
      .canvas-area::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          rgba(108, 92, 231, 0.03) 0%,
          transparent 70%
        );
        pointer-events: none;
      }
      #mainCanvas {
        image-rendering: pixelated;
        cursor: crosshair;
        border-radius: 2px;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
      }

      /* SIDEBAR */
      .sidebar {
        background: var(--panel);
        border-left: 1px solid var(--border);
        width: 240px;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        overflow-y: auto;
      }
      .sb-section {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      .sb-title {
        font-size: 10px;
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: 700;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sb-title svg {
        width: 14px;
        height: 14px;
        stroke: var(--accent);
        fill: none;
        stroke-width: 2;
      }

      /* COLOR */
      .color-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .color-main {
        width: 44px;
        height: 44px;
        border-radius: var(--radius);
        border: 2px solid var(--border2);
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
      }
      .color-main:hover {
        border-color: var(--accent);
        transform: scale(1.05);
      }
      .color-sec {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 2px solid var(--border);
        cursor: pointer;
        margin-left: -12px;
        margin-top: 16px;
        transition: var(--transition);
      }
      .color-sec:hover {
        border-color: var(--accent);
      }
      .color-hex {
        font-family: "JetBrains Mono", monospace;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 1px;
      }
      .color-rgb {
        font-size: 10px;
        color: var(--text3);
        margin-top: 2px;
      }
      .hex-row {
        display: flex;
        gap: 4px;
        margin-bottom: 10px;
      }
      .hex-row input {
        flex: 1;
        background: var(--tool-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        transition: var(--transition);
      }
      .hex-row input:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 12px var(--accent-glow);
      }
      .slider-group {
        margin-bottom: 4px;
      }
      .slider-label {
        display: flex;
        justify-content: between;
        align-items: center;
        margin-bottom: 3px;
      }
      .slider-label span {
        font-size: 10px;
        color: var(--text3);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .slider-label .val {
        font-family: monospace;
        color: var(--text);
        font-size: 11px;
        min-width: 28px;
        text-align: right;
      }
      input[type="range"] {
        width: 100%;
        height: 6px;
        -webkit-appearance: none;
        background: var(--border);
        border-radius: 3px;
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 8px var(--accent-glow);
      }
      .slider-r {
        background: linear-gradient(to right, #000, #f00) !important;
      }
      .slider-g {
        background: linear-gradient(to right, #000, #0f0) !important;
      }
      .slider-b {
        background: linear-gradient(to right, #000, #00f) !important;
      }
      .slider-a {
        background: linear-gradient(to right, transparent, #fff) !important;
      }

      /* COLOR PICKER */
      .cp-wrap {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .cp-square {
        position: relative;
        flex: 1;
        aspect-ratio: 1;
        border-radius: var(--radius-sm);
        cursor: crosshair;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .cp-square canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .cp-cursor {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid #fff;
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.5),
          0 0 8px rgba(0, 0, 0, 0.3);
        pointer-events: none;
        transform: translate(-50%, -50%);
        z-index: 2;
      }
      .cp-hue {
        width: 18px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        position: relative;
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .cp-hue canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .cp-hue-cursor {
        position: absolute;
        left: -2px;
        right: -2px;
        height: 6px;
        border: 2px solid #fff;
        border-radius: 3px;
        box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        transform: translateY(-50%);
        z-index: 2;
      }

      /* GRIDS */
      .color-grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 3px;
      }
      .color-cell {
        aspect-ratio: 1;
        border-radius: 4px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: var(--transition);
      }
      .color-cell:hover {
        transform: scale(1.2);
        border-color: #fff;
        z-index: 1;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.2);
      }
      .recent-row {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .recent-cell {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--border);
        transition: var(--transition);
      }
      .recent-cell:hover {
        border-color: var(--accent);
        transform: scale(1.15);
      }

      /* BRUSH */
      .brush-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brush-row input[type="range"] {
        flex: 1;
      }
      .brush-val {
        font-family: monospace;
        font-size: 13px;
        font-weight: 600;
        color: var(--accent);
        min-width: 24px;
        text-align: center;
      }

      /* BUTTONS */
      .btn-row {
        display: flex;
        gap: 4px;
        margin-bottom: 6px;
      }
      .btn-sm {
        flex: 1;
        background: var(--tool-bg);
        color: var(--text2);
        border: 1px solid var(--border);
        padding: 6px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 11px;
        font-family: inherit;
        font-weight: 500;
        transition: var(--transition);
        text-align: center;
      }
      .btn-sm:hover {
        background: var(--hover);
        color: var(--text);
        border-color: var(--accent);
      }
      .btn-sm.active {
        background: rgba(108, 92, 231, 0.2);
        border-color: var(--accent);
        color: var(--accent2);
      }

      /* RECOLOR */
      .recolor-preview {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .recolor-swatch {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        border: 2px solid var(--border);
        cursor: pointer;
        transition: var(--transition);
      }
      .recolor-swatch:hover {
        border-color: var(--accent);
      }
      .recolor-arrow {
        color: var(--text3);
        font-size: 16px;
      }

      /* TEXT */
      .text-row {
        display: flex;
        gap: 4px;
        margin-bottom: 6px;
      }
      .text-row select,
      .text-row input {
        background: var(--tool-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 5px;
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: 11px;
      }
      .text-row select {
        flex: 1;
      }
      .text-row input[type="number"] {
        width: 48px;
        text-align: center;
      }
      .text-row input[type="text"] {
        flex: 1;
        font-size: 12px;
      }

      /* STATUS */
      .statusbar {
        background: var(--panel);
        border-top: 1px solid var(--border);
        padding: 0 16px;
        font-size: 11px;
        color: var(--text3);
        display: flex;
        gap: 20px;
        height: 26px;
        align-items: center;
        flex-shrink: 0;
      }
      .statusbar .st {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .statusbar .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 6px var(--green);
      }

      /* MODAL */
      .modal-bg {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      .modal-bg.show {
        display: flex;
      }
      .modal {
        background: var(--panel2);
        border: 1px solid var(--border2);
        border-radius: 14px;
        padding: 24px;
        min-width: 340px;
        box-shadow: var(--shadow);
      }
      .modal h2 {
        font-size: 18px;
        margin-bottom: 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 700;
      }
      .modal label {
        font-size: 11px;
        color: var(--text3);
        display: block;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
      }
      .modal input[type="number"] {
        width: 100%;
        background: var(--tool-bg);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        margin-bottom: 12px;
        font-size: 14px;
        font-family: inherit;
      }
      .modal input:focus {
        border-color: var(--accent);
        outline: none;
      }
      .modal .m-btns {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        margin-top: 8px;
      }

      /* IMPORT */
      .import-zone {
        border: 2px dashed var(--border2);
        border-radius: var(--radius);
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: var(--transition);
        margin-bottom: 10px;
      }
      .import-zone:hover {
        border-color: var(--accent);
        background: rgba(108, 92, 231, 0.05);
      }
      .import-zone.dragover {
        border-color: var(--accent2);
        background: rgba(168, 85, 247, 0.1);
      }
      .import-zone svg {
        width: 32px;
        height: 32px;
        stroke: var(--text3);
        margin-bottom: 8px;
      }
      .import-zone p {
        font-size: 12px;
        color: var(--text3);
      }
      .import-zone .big {
        font-size: 14px;
        color: var(--text);
        font-weight: 600;
        margin-bottom: 4px;
      }
      #importFile {
        display: none;
      }
      .import-preview {
        max-width: 100%;
        max-height: 120px;
        border-radius: var(--radius);
        margin-top: 8px;
        display: none;
      }
      .import-actions {
        display: none;
        gap: 4px;
        margin-top: 8px;
      }
      .import-actions.show {
        display: flex;
      }

      /* TOAST */
      .toast {
        position: fixed;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: var(--panel2);
        border: 1px solid var(--accent);
        padding: 10px 20px;
        border-radius: var(--radius);
        font-size: 13px;
        color: var(--text);
        box-shadow: 0 0 30px var(--accent-glow);
        z-index: 200;
        transition: var(--transition);
        opacity: 0;
      }
      .toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="logo-area">
        <div class="logo-icon">R</div>
        <div>
          <div class="logo-text">RankEditor</div>
          <div class="logo-sub">CustomEffects</div>
        </div>
      </div>

      <button class="tb" id="btnUndo" title="Deshacer (Ctrl+Z)">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M3 10h10a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5H8" />
          <path d="M3 10l4-4M3 10l4 4" />
        </svg>
      </button>
      <button class="tb" id="btnRedo" title="Rehacer (Ctrl+Y)">
        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 10H11a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5h5" />
          <path d="M21 10l-4-4M21 10l-4 4" />
        </svg>
      </button>

      <div class="sep"></div>

      <button class="tb" id="btnImport" title="Importar imagen">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" y1="3" x2="12" y2="15" />
        </svg>
        Import
      </button>

      <div class="sep"></div>

      <label>W</label>
      <input type="number" id="canvasW" value="128" min="1" max="512" />
      <label>H</label>
      <input type="number" id="canvasH" value="32" min="1" max="512" />
      <button class="tb" id="btnResizeApply" title="Aplicar tamaño">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
      </button>

      <div class="sep"></div>

      <button class="tb" id="btnGrid" title="Grid (G)">
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="3" y="3" width="18" height="18" />

    <script>
      (function () {
        "use strict";

        const MC_COLORS = [

        const PALETTE = [

          "#05668d",

          "#f1faee",

          "#457b9d",
          "#1d3557",
          "#6a0572",
          "#ab83a1",
          "#c9ada7",
          "#9a8c98",
          "#4a4e69",
          "#22223b",
          "#f2e9e4",
          "#e8d5b7",
          "#b08968",
          "#7f5539",
          "#9c6644",
          "#ff006e",
          "#fb5607",

          "#118ab2",

          "#333333",
          "#666666",

          "#cccccc",
          "#ffffff",
          "#800000",
          "#804000",
          "#808000",
          "#008000",
          "#008080",
          "#000080",
          "#800080",
          "#808080",
        ];

        const canvas = document.getElementById("mainCanvas"),
          ctx = canvas.getContext("2d"),
          canvasArea = document.getElementById("canvasArea");
        let imgW = 128,
          imgH = 32,
          zoom = 8,
          showGrid = false,
          currentTool = "brush";
        let primaryColor = { r: 233, g: 69, b: 96, a: 255 },
          secondaryColor = { r: 0, g: 0, b: 0, a: 0 };
        let brushSize = 1,
          eraserSize = 1,
          textBold = false,
          textItalic = false;
        let recolorFrom = { r: 255, g: 0, b: 0, a: 255 },
          recolorTo = { r: 0, g: 255, b: 0, a: 255 };
        let recentColors = [],
          clipboard = null;
        let history = [],
          historyIndex = -1;
        const MAX_HISTORY = 60;
        let isDrawing = false,
          lastX = -1,
          lastY = -1,
          startX = -1,
          startY = -1;
        let selection = null,
          selDrag = false,
          selOffX = 0,
          selOffY = 0;
        let importImg = null;

        function toast(msg) {
          let t = document.getElementById("toast");
          t.textContent = msg;
          t.classList.add("show");
          setTimeout(() => t.classList.remove("show"), 2000);
        }

        function init() {
          canvas.width = imgW;
          canvas.height = imgH;
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, imgW, imgH);
          renderCanvas();
          pushHistory();
          updateSizeInputs();
        }

        function renderCanvas() {
          let dw = imgW * zoom,
            dh = imgH * zoom;
          canvas.style.width = dw + "px";
          canvas.style.height = dh + "px";
          let aw = canvasArea.clientWidth,
            ah = canvasArea.clientHeight;
          canvas.style.position = "absolute";
          canvas.style.left = Math.max(0, (aw - dw) / 2) + "px";
          canvas.style.top = Math.max(0, (ah - dh) / 2) + "px";

          document.getElementById("statusSize").textContent =
            imgW + " x " + imgH;
          document.getElementById("statusZoom").textContent = zoom + "x";
        }

        function renderOverlays() {
          if (showGrid && zoom >= 4) {
            ctx.save();
            ctx.strokeStyle = "rgba(255,255,255,0.12)";
            ctx.lineWidth = 0.5;
            for (let x = 0; x <= imgW; x++) {
              ctx.beginPath();
              ctx.moveTo(x, 0);
              ctx.lineTo(x, imgH);
              ctx.stroke();
            }
            for (let y = 0; y <= imgH; y++) {
              ctx.beginPath();
              ctx.moveTo(0, y);
              ctx.lineTo(imgW, y);
              ctx.stroke();
            }
            ctx.restore();
          }
          if (selection) {
            ctx.save();
            ctx.strokeStyle = "#fff";
            ctx.lineWidth = 1 / zoom;
            ctx.setLineDash([3 / zoom, 2 / zoom]);
            ctx.strokeRect(selection.x, selection.y, selection.w, selection.h);
            ctx.setLineDash([]);
            ctx.restore();
          }
        }

        function restoreFromHistory() {
          if (historyIndex >= 0 && history[historyIndex])
            ctx.putImageData(history[historyIndex], 0, 0);
        }

        function markDirty() {}

        function getPixel(x, y) {
          if (x < 0 || y < 0 || x >= imgW || y >= imgH)
            return { r: 0, g: 0, b: 0, a: 0 };
          let d = ctx.getImageData(x, y, 1, 1).data;
          return { r: d[0], g: d[1], b: d[2], a: d[3] };
        }
        function setPixel(x, y, c) {
          if (x < 0 || y < 0 || x >= imgW || y >= imgH) return;
          let d = ctx.createImageData(1, 1);
          d.data[0] = c.r;
          d.data[1] = c.g;
          d.data[2] = c.b;
          d.data[3] = c.a;
          ctx.putImageData(d, x, y);
        }
        function drawLine(x0, y0, x1, y1, sz, col) {
          let dx = Math.abs(x1 - x0),
            dy = Math.abs(y1 - y0),
            sx = x0 < x1 ? 1 : -1,
            sy = y0 < y1 ? 1 : -1,
            err = dx - dy;
          while (true) {
            fillCircle(x0, y0, sz, col);
            if (x0 === x1 && y0 === y1) break;
            let e2 = 2 * err;
            if (e2 > -dy) {
              err -= dy;
              x0 += sx;
            }
            if (e2 < dx) {
              err += dx;
              y0 += sy;
            }
          }
        }
        function fillCircle(cx, cy, r, col) {
          let r2 = r * r;
          for (let dy = -r; dy <= r; dy++)
            for (let dx = -r; dx <= r; dx++)
              if (dx * dx + dy * dy <= r2) setPixel(cx + dx, cy + dy, col);
        }
        function floodFill(sx, sy, fc) {
          let t = getPixel(sx, sy);
          if (t.r === fc.r && t.g === fc.g && t.b === fc.b && t.a === fc.a)
            return;
          let st = [[sx, sy]],
            v = new Set();
          while (st.length) {
            let [x, y] = st.pop(),
              k = x + "," + y;
            if (v.has(k) || x < 0 || y < 0 || x >= imgW || y >= imgH) continue;
            let p = getPixel(x, y);
            if (p.r !== t.r || p.g !== t.g || p.b !== t.b || p.a !== t.a)
              continue;
            v.add(k);
            setPixel(x, y, fc);
            st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
          }
        }
        function drawRect(x0, y0, x1, y1, out, col) {
          let a = Math.min(x0, x1),
            b = Math.max(x0, x1),
            c = Math.min(y0, y1),
            d = Math.max(y0, y1);
          if (out) {
            for (let x = a; x <= b; x++) {
              setPixel(x, c, col);
              setPixel(x, d, col);
            }
            for (let y = c; y <= d; y++) {
              setPixel(a, y, col);
              setPixel(b, y, col);
            }
          } else {
            for (let y = c; y <= d; y++)
              for (let x = a; x <= b; x++) setPixel(x, y, col);
          }
        }
        function drawEllipse(cx, cy, rx, ry, out, col) {
          if (out) {
            for (let a = 0; a < 360; a++) {
              let r = (a * Math.PI) / 180;
              setPixel(
                Math.round(cx + rx * Math.cos(r)),
                Math.round(cy + ry * Math.sin(r)),
                col,
              );
            }
          } else {
            let r2 = rx * rx,
              s2 = ry * ry;
            for (let y = -ry; y <= ry; y++)
              for (let x = -rx; x <= rx; x++)
                if ((x * x) / r2 + (y * y) / s2 <= 1)
                  setPixel(cx + x, cy + y, col);
          }
        }
        function drawText(text, x, y, font, sz, bold, italic, col) {
          let s = "";
          if (italic) s += "italic ";
          if (bold) s += "bold ";
          ctx.font = s + sz + "px " + font;
          ctx.fillStyle =
            "rgba(" +
            col.r +
            "," +
            col.g +
            "," +
            col.b +
            "," +
            col.a / 255 +
            ")";
          ctx.textBaseline = "top";
          ctx.fillText(text, x, y);
        }
        function recolorImage(fc, tc) {
          let d = ctx.getImageData(0, 0, imgW, imgH);
          for (let i = 0; i < d.data.length; i += 4)
            if (
              d.data[i] === fc.r &&
              d.data[i + 1] === fc.g &&
              d.data[i + 2] === fc.b &&
              d.data[i + 3] === fc.a
            ) {
              d.data[i] = tc.r;
              d.data[i + 1] = tc.g;
              d.data[i + 2] = tc.b;
              d.data[i + 3] = tc.a;
            }
          ctx.putImageData(d, 0, 0);
        }

        function pushHistory() {
          historyIndex++;
          history = history.slice(0, historyIndex);
          history.push(ctx.getImageData(0, 0, imgW, imgH));
          if (history.length > MAX_HISTORY) {
            history.shift();
            historyIndex--;
          }
          updateUndoRedoBtns();
        }
        function undo() {
          if (historyIndex <= 0) return;
          historyIndex--;
          restoreFromHistory();
          renderCanvas();
          updateUndoRedoBtns();
        }
        function redo() {
          if (historyIndex >= history.length - 1) return;
          historyIndex++;
          restoreFromHistory();
          renderCanvas();
          updateUndoRedoBtns();
        }
        function updateUndoRedoBtns() {
          document.getElementById("btnUndo").disabled = historyIndex <= 0;
          document.getElementById("btnRedo").disabled =
            historyIndex >= history.length - 1;
        }

        function getCanvasPos(e) {
          let r = canvas.getBoundingClientRect();
          let x = Math.floor((e.clientX - r.left) / zoom),
            y = Math.floor((e.clientY - r.top) / zoom);
          return {
            x: Math.max(0, Math.min(imgW - 1, x)),
            y: Math.max(0, Math.min(imgH - 1, y)),
          };
        }
        function colStr(c) {
          return "rgba(" + c.r + "," + c.g + "," + c.b + "," + c.a / 255 + ")";
        }
        function colHex(c) {
          return (
            "#" +
            [c.r, c.g, c.b]
              .map((v) => v.toString(16).padStart(2, "0"))
              .join("")
              .toUpperCase()
          );
        }

        function setColorFromHex(hex) {
          hex = hex.replace("#", "");
          if (hex.length === 3)
            hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
          if (hex.length !== 6) return;
          primaryColor = {
            r: parseInt(hex.substring(0, 2), 16),
            g: parseInt(hex.substring(2, 4), 16),
            b: parseInt(hex.substring(4, 6), 16),

        function addRecentColor(c) {

          if (currentTool === "brush") {
            drawLine(lastX, lastY, pos.x, pos.y, brushSize, primaryColor);
            lastX = pos.x;
            lastY = pos.y;

              r: 0,
              g: 0,
              b: 0,

            lastX = pos.x;
            lastY = pos.y;

            let c = getPixel(pos.x, pos.y);
            if (c.a > 0) {
              primaryColor = c;
              updateColorUI();
            }
          } else if (
            currentTool === "line" ||
            currentTool === "rect" ||
            currentTool === "circle"
          ) {
            if (historyIndex >= 0 && history[historyIndex])
              ctx.putImageData(history[historyIndex], 0, 0);
            if (currentTool === "line")
              drawLine(startX, startY, pos.x, pos.y, brushSize, primaryColor);
            else if (currentTool === "rect")
              drawRect(startX, startY, pos.x, pos.y, e.shiftKey, primaryColor);
            else {
              let cx = Math.round((startX + pos.x) / 2),
                cy = Math.round((startY + pos.y) / 2),
                rx = Math.abs(pos.x - startX) / 2,
                ry = Math.abs(pos.y - startY) / 2;
              drawEllipse(
                cx,
                cy,
                Math.round(rx),
                Math.round(ry),
                e.shiftKey,
                primaryColor,
              );
            }
            renderCanvas();
          } else if (currentTool === "select" && selDrag) {
            selection.x = pos.x - selOffX;
            selection.y = pos.y - selOffY;
            renderCanvas();
          }
        });
        canvas.addEventListener("mouseup", (e) => {
          if (!isDrawing) return;
          let pos = getCanvasPos(e);
          if (
            currentTool === "line" ||
            currentTool === "rect" ||
            currentTool === "circle"
          ) {
            if (historyIndex >= 0 && history[historyIndex])
              ctx.putImageData(history[historyIndex], 0, 0);
            if (currentTool === "line")
              drawLine(startX, startY, pos.x, pos.y, brushSize, primaryColor);
            else if (currentTool === "rect")
              drawRect(startX, startY, pos.x, pos.y, e.shiftKey, primaryColor);
            else {
              let cx = Math.round((startX + pos.x) / 2),
                cy = Math.round((startY + pos.y) / 2),
                rx = Math.abs(pos.x - startX) / 2,
                ry = Math.abs(pos.y - startY) / 2;
              drawEllipse(
                cx,
                cy,
                Math.round(rx),

                primaryColor,

          } else if (currentTool === "select") {
            if (!selDrag) {

                y = Math.min(startY, pos.y),
                w = Math.abs(pos.x - startX),
                h = Math.abs(pos.y - startY);
              if (w > 0 && h > 0) selection = { x, y, w, h };
              renderCanvas();

            selDrag = false;
          } else if (
            currentTool === "brush" ||
            currentTool === "eraser" ||
            currentTool === "fill"

        // COLOR PICKER
        let cpHue = 0,
          cpSat = 1,
          cpBri = 1;
        let cpDragging = false,
          cpHueDragging = false;

        function rgbToHsv(r, g, b) {
          r /= 255;
          g /= 255;
          b /= 255;
          let mx = Math.max(r, g, b),
            mn = Math.min(r, g, b),
            h = 0,
            s = mx === 0 ? 0 : (mx - mn) / mx,
            v = mx;
          if (mx !== mn) {
            let d = mx - mn;
            if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0)) / 6;
            else if (mx === g) h = ((b - r) / d + 2) / 6;
            else h = ((r - g) / d + 4) / 6;
          }
          return { h, s, v };
        }
        function hsvToRgb(h, s, v) {
          let i = Math.floor(h * 6),
            f = h * 6 - i,
            p = v * (1 - s),
            q = v * (1 - f * s),
            t = v * (1 - (1 - f) * s);
          let r, g, b;
          switch (i % 6) {
            case 0:
              r = v;
              g = t;
              b = p;
              break;
            case 1:
              r = q;
              g = v;
              b = p;
              break;
            case 2:
              r = p;
              g = v;
              b = t;
              break;
            case 3:
              r = p;
              g = q;
              b = v;
              break;
            case 4:
              r = t;
              g = p;
              b = v;
              break;
            case 5:
              r = v;
              g = p;
              b = q;
              break;
          }
          return {
            r: Math.round(r * 255),
            g: Math.round(g * 255),
            b: Math.round(b * 255),
          };
        }

        function drawHueBar() {
          let c = document.getElementById("cpHueCanvas"),
            x = c.getContext("2d"),
            w = c.width,
            h = c.height;
          let g = x.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, "#f00");
          g.addColorStop(1 / 6, "#ff0");
          g.addColorStop(2 / 6, "#0f0");
          g.addColorStop(3 / 6, "#0ff");
          g.addColorStop(4 / 6, "#00f");
          g.addColorStop(5 / 6, "#f0f");
          g.addColorStop(1, "#f00");
          x.fillStyle = g;
          x.fillRect(0, 0, w, h);
        }

        function drawSatBriSquare() {
          let c = document.getElementById("cpSquareCanvas"),
            x = c.getContext("2d"),
            w = c.width,
            h = c.height;
          let hueRgb = hsvToRgb(cpHue, 1, 1);
          x.fillStyle = `rgb(${hueRgb.r},${hueRgb.g},${hueRgb.b})`;
          x.fillRect(0, 0, w, h);
          let gW = x.createLinearGradient(0, 0, w, 0);
          gW.addColorStop(0, "#fff");
          gW.addColorStop(1, "transparent");
          x.fillStyle = gW;
          x.fillRect(0, 0, w, h);
          let gB = x.createLinearGradient(0, 0, 0, h);
          gB.addColorStop(0, "transparent");
          gB.addColorStop(1, "#000");
          x.fillStyle = gB;
          x.fillRect(0, 0, w, h);
        }

        function updatePickerCursors() {
          let sq = document.getElementById("cpSquare");
          let cx = cpSat * sq.clientWidth,
            cy = (1 - cpBri) * sq.clientHeight;
          document.getElementById("cpCursor").style.left = cx + "px";
          document.getElementById("cpCursor").style.top = cy + "px";
          let hueEl = document.getElementById("cpHue");
          document.getElementById("cpHueCursor").style.top =
            cpHue * hueEl.clientHeight + "px";
          let curRgb = hsvToRgb(cpHue, cpSat, cpBri);
          document.getElementById("cpCursor").style.background =
            `rgb(${curRgb.r},${curRgb.g},${curRgb.b})`;
        }

        function updatePickerFromRGB() {
          let hsv = rgbToHsv(primaryColor.r, primaryColor.g, primaryColor.b);
          cpHue = hsv.h;
          cpSat = hsv.s;
          cpBri = hsv.v;
          drawSatBriSquare();
          updatePickerCursors();
        }

        function pickFromSquare(e) {
          let rect = document
            .getElementById("cpSquare")
            .getBoundingClientRect();
          let x = Math.max(
            0,
            Math.min(1, (e.clientX - rect.left) / rect.width),
          );
          let y = Math.max(
            0,
            Math.min(1, (e.clientY - rect.top) / rect.height),
          );
          cpSat = x;
          cpBri = 1 - y;
          let rgb = hsvToRgb(cpHue, cpSat, cpBri);
          primaryColor = { r: rgb.r, g: rgb.g, b: rgb.b, a: primaryColor.a };
          updateColorUI();
          updatePickerCursors();
        }

        function pickFromHue(e) {
          let rect = document.getElementById("cpHue").getBoundingClientRect();
          cpHue = Math.max(
            0,
            Math.min(1, (e.clientY - rect.top) / rect.height),
          );
          drawSatBriSquare();
          let rgb = hsvToRgb(cpHue, cpSat, cpBri);
          primaryColor = { r: rgb.r, g: rgb.g, b: rgb.b, a: primaryColor.a };
          updateColorUI();
          updatePickerCursors();
        }

        document
          .getElementById("cpSquare")
          .addEventListener("mousedown", (e) => {
            cpDragging = true;
            pickFromSquare(e);
          });
        document.getElementById("cpHue").addEventListener("mousedown", (e) => {
          cpHueDragging = true;
          pickFromHue(e);
        });
        document.addEventListener("mousemove", (e) => {
          if (cpDragging) pickFromSquare(e);
          if (cpHueDragging) pickFromHue(e);
        });
        document.addEventListener("mouseup", () => {
          cpDragging = false;
          cpHueDragging = false;
        });

        drawHueBar();
        drawSatBriSquare();
        updatePickerFromRGB();
        document.getElementById("toolSize").addEventListener("input", (e) => {
          let sz = +e.target.value;
          document.getElementById("toolSizeVal").textContent = sz;
          if (currentTool === "brush") brushSize = sz;
          else if (currentTool === "eraser") eraserSize = sz;
        });
        document.getElementById("zoomLevel").addEventListener("change", (e) => {
          zoom = +e.target.value;
          renderCanvas();
        });
        document.getElementById("btnGrid").addEventListener("click", () => {
          showGrid = !showGrid;
          document
            .getElementById("btnGrid")
            .classList.toggle("active", showGrid);
          renderCanvas();
        });
        document.getElementById("btnUndo").addEventListener("click", undo);
        document.getElementById("btnRedo").addEventListener("click", redo);
        document.getElementById("btnClear").addEventListener("click", () => {
          ctx.clearRect(0, 0, imgW, imgH);
          pushHistory();
          renderCanvas();
          toast("Canvas limpiado");
        });

        // RESIZE
        document
          .getElementById("btnResizeApply")
          .addEventListener("click", () => {
            let nw = Math.max(
              1,
              Math.min(
                512,
                parseInt(document.getElementById("canvasW").value) || imgW,
              ),
            );
            let nh = Math.max(
              1,
              Math.min(
                512,
                parseInt(document.getElementById("canvasH").value) || imgH,
              ),
            );
            resizeCanvas(nw, nh);
          });
        document.getElementById("canvasW").addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            let nw = Math.max(
              1,
              Math.min(512, parseInt(e.target.value) || imgW),
            );
            resizeCanvas(nw, imgH);
          }
        });
        document.getElementById("canvasH").addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            let nh = Math.max(
              1,
              Math.min(512, parseInt(e.target.value) || imgH),
            );
            resizeCanvas(imgW, nh);
          }
        });
        function resizeCanvas(nw, nh) {
          let tmp = document.createElement("canvas");
          tmp.width = nw;
          tmp.height = nh;
          let tctx = tmp.getContext("2d");
          tctx.imageSmoothingEnabled = false;
          tctx.drawImage(canvas, 0, 0);
          imgW = nw;
          imgH = nh;
          canvas.width = nw;
          canvas.height = nh;
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(tmp, 0, 0);
          pushHistory();
          renderCanvas();
          updateSizeInputs();
          toast("Canvas: " + nw + " x " + nh);
        }
        function updateSizeInputs() {
          document.getElementById("canvasW").value = imgW;
          document.getElementById("canvasH").value = imgH;
        }

        // CLIPBOARD
        document.getElementById("btnCopy").addEventListener("click", () => {
          if (!selection) return;
          clipboard = {
            data: ctx.getImageData(
              selection.x,
              selection.y,
              selection.w,
              selection.h,
            ),
            w: selection.w,
            h: selection.h,
          };
          toast("Copiado");
        });
        document.getElementById("btnPaste").addEventListener("click", () => {
          if (!clipboard) return;
          ctx.putImageData(
            clipboard.data,
            selection ? selection.x : 0,
            selection ? selection.y : 0,
          );
          pushHistory();
          renderCanvas();
          toast("Pegado");
        });
        document.getElementById("btnCut").addEventListener("click", () => {
          if (!selection) return;
          clipboard = {
            data: ctx.getImageData(
              selection.x,
              selection.y,
              selection.w,
              selection.h,
            ),
            w: selection.w,
            h: selection.h,
          };
          ctx.clearRect(selection.x, selection.y, selection.w, selection.h);
          pushHistory();
          renderCanvas();
          toast("Cortado");
        });
        document.getElementById("btnCrop").addEventListener("click", () => {
          if (!selection) return;
          let d = ctx.getImageData(
            selection.x,
            selection.y,
            selection.w,
            selection.h,
          );
          imgW = selection.w;
          imgH = selection.h;
          canvas.width = imgW;
          canvas.height = imgH;
          ctx.putImageData(d, 0, 0);
          selection = null;
          pushHistory();
          renderCanvas();
          updateSizeInputs();
          toast("Recortado");
        });
        document.getElementById("btnSelAll").addEventListener("click", () => {
          selection = { x: 0, y: 0, w: imgW, h: imgH };
          renderCanvas();
        });
        document.getElementById("btnDeselect").addEventListener("click", () => {
          selection = null;
          renderCanvas();
        });

        // BOLD/ITALIC
        document.getElementById("btnBold").addEventListener("click", () => {
          textBold = !textBold;
          document
            .getElementById("btnBold")
            .classList.toggle("active", textBold);
        });
        document.getElementById("btnItalic").addEventListener("click", () => {
          textItalic = !textItalic;
          document
            .getElementById("btnItalic")
            .classList.toggle("active", textItalic);
        });

        // RECOLOR
        document.getElementById("btnRecolor").addEventListener("click", () => {
          recolorImage(recolorFrom, recolorTo);
          pushHistory();
          renderCanvas();
          toast("Recolor aplicado");
        });
        document
          .getElementById("btnRecolorPick")
          .addEventListener("click", () => {
            currentTool = "recolor";
            document
              .querySelectorAll(".tool-btn")
              .forEach((b) => b.classList.remove("active"));
            document
              .querySelector('[data-tool="recolor"]')
              .classList.add("active");
            document.getElementById("statusTool").textContent =
              "Recolor (pick)";
          });
        document.getElementById("recolorFrom").addEventListener("click", () => {
          let h = prompt("Color origen (hex):", colHex(recolorFrom));
          if (h) {
            setColorFromHex(h);
            recolorFrom = { ...primaryColor };
            document.getElementById("recolorFrom").style.background =
              colStr(recolorFrom);
          }
        });
        document.getElementById("recolorTo").addEventListener("click", () => {
          let h = prompt("Color destino (hex):", colHex(recolorTo));
          if (h) {
            setColorFromHex(h);
            recolorTo = { ...primaryColor };
            document.getElementById("recolorTo").style.background =
              colStr(recolorTo);
          }
        });

        // EXPORT
        document.getElementById("btnExport").addEventListener("click", () => {
          let a = document.createElement("a");
          a.download = "rank_texture.png";
          a.href = canvas.toDataURL("image/png");
          a.click();
          toast("PNG descargado");
        });

        // SHORTCUTS
        document.addEventListener("keydown", (e) => {
          if (
            e.target.tagName === "INPUT" ||
            e.target.tagName === "SELECT" ||
            e.target.tagName === "TEXTAREA"
          )
            return;
          if (e.ctrlKey || e.metaKey) {
            if (e.key === "z") {
              e.preventDefault();
              undo();
            }
            if (e.key === "y") {
              e.preventDefault();
              redo();
            }
            if (e.key === "c") {
              e.preventDefault();
              document.getElementById("btnCopy").click();
            }
            if (e.key === "v") {
              e.preventDefault();
              document.getElementById("btnPaste").click();
            }
            if (e.key === "x") {
              e.preventDefault();
              document.getElementById("btnCut").click();
            }
            if (e.key === "i") {
              e.preventDefault();
              document.getElementById("btnImport").click();
            }
            return;
          }
          let tk = {
            b: "brush",
            e: "eraser",
            i: "eyedropper",
            f: "fill",
            l: "line",
            r: "rect",
            c: "circle",
            t: "text",
            s: "select",
            k: "recolor",
          };
          if (tk[e.key]) {
            currentTool = tk[e.key];
            document
              .querySelectorAll(".tool-btn")
              .forEach((b) => b.classList.remove("active"));
            document
              .querySelector('[data-tool="' + currentTool + '"]')
              ?.classList.add("active");
            let n = {
              brush: "Pincel",
              eraser: "Borrador",
              eyedropper: "Selector",
              fill: "Cubeta",
              line: "Linea",
              rect: "Rectangulo",
              circle: "Circulo",
              text: "Texto",
              select: "Seleccion",
              recolor: "Recolor",
            };
            document.getElementById("statusTool").textContent =
              n[currentTool] || currentTool;
          }
        });
        window.addEventListener("resize", () => renderCanvas());

        initMCColors();
        initPresets();
        updateColorUI();
        init();
      })();
    </script>
  </body>
</html>
